name: nightly

# A dev build of every push to main: the x86_64 Windows installer, Linux executable, AppImage and
# .deb, built by release.yml and kept as workflow artifacts for a week. Setting the repository
# variable NIGHTLY_RELEASE to true also replaces a rolling `nightly` prerelease with them.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/release.yml
    # release.yml's tag-only jobs ask for this, and a called workflow cannot ask for more than
    # its caller grants, even for jobs that a nightly skips.
    permissions:
      contents: write
    with:
      nightly: true

  publish:
    needs: build
    if: vars.NIGHTLY_RELEASE == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: checksums
        run: cd dist && sha256sum -- * > SHA256SUMS

      # The tag moves with the release: deleting both and creating them again at this commit
      # is what drops the previous build's assets, whose names carry its commit.
      - name: replace the nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA:0:7}"
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly $short" \
            --notes "An untested build of $short on main. It replaces itself with every push, and nothing updates it for you."
