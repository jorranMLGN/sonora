name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # nightly.yml reuses this workflow for its builds. Nothing here publishes anything outside a
  # tag, so a nightly run only ever leaves workflow artifacts behind.
  workflow_call:
    inputs:
      nightly:
        description: build only the x86_64 Linux and Windows targets, with short-lived artifacts
        type: boolean
        default: false

# github.workflow is the caller's name when nightly.yml calls in, so the two never share a group.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # The targets to build, as matrices the jobs below read. A nightly keeps the ones marked so.
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      appimage: ${{ steps.plan.outputs.appimage }}
    steps:
      - name: pick the targets
        id: plan
        env:
          NIGHTLY: ${{ inputs.nightly == true }}
        run: |
          set -euo pipefail
          targets='[
            {"target": "x86_64-unknown-linux-gnu", "os": "ubuntu-22.04", "nightly": true},
            {"target": "aarch64-unknown-linux-gnu", "os": "ubuntu-22.04-arm"},
            {"target": "aarch64-apple-darwin", "os": "macos-15"},
            {"target": "x86_64-apple-darwin", "os": "macos-15-intel"},
            {"target": "x86_64-pc-windows-msvc", "os": "windows-latest",
             "arch": "x64compatible", "setup": "Sonora-Setup", "nightly": true},
            {"target": "aarch64-pc-windows-msvc", "os": "windows-11-arm",
             "arch": "arm64", "setup": "Sonora-Setup-arm64"}
          ]'
          if [ "$NIGHTLY" = true ]; then
            targets="$(jq 'map(select(.nightly))' <<< "$targets")"
          fi
          build="$(jq -c 'map(del(.nightly))' <<< "$targets")"
          appimage="$(jq -c '
            map(select(.target | endswith("-linux-gnu"))
              | {arch: (.target | split("-")[0]), target, runner: .os})
          ' <<< "$targets")"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "appimage=$appimage" >> "$GITHUB_OUTPUT"
          echo "build: $build"
          echo "appimage: $appimage"

  build:
    name: ${{ matrix.target }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v5

      - name: name the artifact
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) version="$GITHUB_REF_NAME" ;;
            *) version="${GITHUB_SHA:0:7}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake mold \
            libasound2-dev libfontconfig1-dev libfreetype-dev libsqlite3-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true
      - name: build
        run: cargo build --release --locked --package sonora --target ${{ matrix.target }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats
      - name: stage the executable
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "$RUNNER_OS" in
            macOS)
              cp \
                "target/$TARGET/release/sonora" \
                "dist/sonora-$TARGET"
              ;;

            Windows)
              cp \
                "target/$TARGET/release/sonora.exe" \
                "dist/sonora-$VERSION-$TARGET.exe"
              ;;

            *)
              cp \
                "target/$TARGET/release/sonora" \
                "dist/sonora-$VERSION-$TARGET"
              ;;
          esac

      - name: install cargo-deb
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-deb

      - name: build the Debian package
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: ./scripts/build-deb.sh "$TARGET" "$VERSION" dist

      # Installing it on the runner is what proves its Depends resolve against the archive the
      # package was built on, which is the oldest Ubuntu it is meant for.
      - name: inspect the Debian package
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb="$(echo dist/*.deb)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          sudo apt-get install -y --no-install-recommends "./$deb"
          test -x /usr/bin/sonora
          test -f /usr/share/applications/sonora.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/sonora.svg
          test -f /usr/share/metainfo/io.github.nolight132.sonora.metainfo.xml
          test -f /usr/share/doc/sonora/THIRD-PARTY.md

      - name: install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
          SONORA_ARCH: ${{ matrix.arch }}
          SONORA_SETUP: ${{ matrix.setup }}
        run: |
          $number = $env:VERSION.TrimStart("v")
          if ($number -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            $number = "0.0.0"
          }
          $env:SONORA_VERSION = $number
          $env:SONORA_EXE = (Resolve-Path "target/$env:TARGET/release/sonora.exe").Path
          $env:SONORA_DIST = (Resolve-Path "dist").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "scripts/windows/sonora.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ runner.os == 'macOS' && format('darwin-{0}', matrix.target) || format('release-{0}', matrix.target) }}"
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.nightly && 7 || 0 }}

  bundle:
    name: macos app bundle
    needs: build
    if: ${{ !inputs.nightly }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: name the artifact
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              version="$GITHUB_REF_NAME"
              number="${GITHUB_REF_NAME#v}"
              ;;

            *)
              version="${GITHUB_SHA:0:7}"
              number="0.0.0"
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: darwin-*
          path: darwin
          merge-multiple: true

      - name: assemble the bundle
        shell: bash
        env:
          NUMBER: ${{ steps.meta.outputs.number }}
        run: |
          set -euo pipefail

          mkdir -p \
            Sonora.app/Contents/MacOS \
            Sonora.app/Contents/Resources

          lipo -create \
            -output Sonora.app/Contents/MacOS/sonora \
            darwin/sonora-aarch64-apple-darwin \
            darwin/sonora-x86_64-apple-darwin
          chmod +x Sonora.app/Contents/MacOS/sonora
          lipo -info Sonora.app/Contents/MacOS/sonora

          cp \
            assets/macos/sonora.icns \
            Sonora.app/Contents/Resources/

          cp \
            COPYING \
            Sonora.app/Contents/Resources/LICENSE

          cp \
            THIRD-PARTY.md \
            Sonora.app/Contents/Resources/

          cp \
            assets/fonts/LICENSE.txt \
            Sonora.app/Contents/Resources/LICENSE.Inter

          mkdir -p Sonora.app/Contents/Resources/icons
          cp assets/icons/LICENSE Sonora.app/Contents/Resources/icons/LICENSE
          for licence in assets/icons/*/LICENSE; do
            pack="$(basename "$(dirname "$licence")")"
            cp "$licence" "Sonora.app/Contents/Resources/icons/LICENSE.$pack"
          done

          sed \
            "s/@VERSION@/$NUMBER/g" \
            assets/macos/Info.plist \
            > Sonora.app/Contents/Info.plist

          plutil -lint Sonora.app/Contents/Info.plist

      - name: sign the bundle
        shell: bash
        run: |
          set -euo pipefail

          codesign \
            --force \
            --sign - \
            Sonora.app

          codesign \
            --verify \
            --strict \
            --verbose=2 \
            Sonora.app

      - name: create the disk image
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist staging
          cp -R Sonora.app staging/
          ln -s /Applications staging/Applications
          megabytes=$(du -ms staging | cut -f1)
          hdiutil create \
            -volname Sonora \
            -srcfolder staging \
            -size "$((megabytes + 128))m" \
            -ov \
            -format UDZO \
            "dist/sonora-$VERSION-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error

  appimage:
    name: "AppImage (${{ matrix.variant.arch }})"
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.appimage) }}

    runs-on: ${{ matrix.variant.runner }}

    env:
      # The runner images carry no libfuse2, so every AppImage tool has to unpack itself.
      APPIMAGE_EXTRACT_AND_RUN: 1
      ARCH: ${{ matrix.variant.arch }}

    steps:
      - uses: actions/checkout@v5

      - name: name the artifact
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              version="$GITHUB_REF_NAME"
              number="${GITHUB_REF_NAME#v}"
              ;;

            *)
              version="${GITHUB_SHA:0:7}"
              number=""
              ;;
          esac

          # Only a stable tag embeds where to update from. GitHub's latest release never points
          # at a prerelease, so a beta would be offered an older stable build, and an untagged
          # build would be offered a release it was never cut from.
          update=""
          case "$number" in
            "" | *-*) ;;
            *) update="gh-releases-zsync|${GITHUB_REPOSITORY%/*}|${GITHUB_REPOSITORY#*/}|latest|sonora-*-$ARCH.AppImage.zsync" ;;
          esac

          {
            echo "version=$version"
            echo "number=$number"
            echo "update=$update"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.variant.target }}
          path: staged

      # The libraries the executable links, so linuxdeploy can resolve and copy them. Its own
      # excludelist decides which of them stay behind and come from the host instead.
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            patchelf file desktop-file-utils \
            libasound2 libfontconfig1 libfreetype6 libsqlite3-0 \
            libx11-6 libxcb1 libxcursor1 libxi6 \
            libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 \
            libvulkan1 libdbus-1-3

      - name: fetch the AppImage tools
        run: |
          set -euo pipefail
          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          curl -fsSL -o linuxdeploy "$base/linuxdeploy-$ARCH.AppImage"
          base=https://github.com/AppImage/appimagetool/releases/download/continuous
          curl -fsSL -o appimagetool "$base/appimagetool-$ARCH.AppImage"
          chmod +x linuxdeploy appimagetool

      - name: assemble the AppDir
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          NUMBER: ${{ steps.meta.outputs.number }}
          UPDATE: ${{ steps.meta.outputs.update }}
          TARGET: ${{ matrix.variant.target }}
        run: |
          set -euo pipefail

          mkdir -p AppDir/usr/bin
          cp "staged/sonora-$VERSION-$TARGET" AppDir/usr/bin/sonora
          chmod +x AppDir/usr/bin/sonora

          # Every asset is compiled into the executable, so the AppDir carries the desktop entry
          # and the icons for the host's launcher and nothing else.
          mkdir -p AppDir/usr/share/icons
          cp -R assets/linux/icons/hicolor AppDir/usr/share/icons/

          # The keys AppImage managers identify and version the app by go into a copy, so the
          # entry the Flatpak and the distribution packages install stays as it is.
          homepage="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          mkdir -p desktop
          cp assets/linux/sonora.desktop desktop/sonora.desktop
          {
            echo "X-AppImage-Name=Sonora"
            echo "X-AppImage-Arch=$ARCH"
            echo "X-AppImage-Homepage=$homepage"
            if [ -n "$NUMBER" ]; then echo "X-AppImage-Version=$NUMBER"; fi
            if [ -n "$UPDATE" ]; then echo "X-AppImage-UpdateURL=$homepage"; fi
          } >> desktop/sonora.desktop
          desktop-file-validate desktop/sonora.desktop

          ./linuxdeploy \
            --appdir AppDir \
            --executable AppDir/usr/bin/sonora \
            --desktop-file desktop/sonora.desktop \
            --icon-file assets/linux/sonora.svg

          # The Vulkan loader has to be the host's: it is what finds the host's ICD, and a loader
          # this old paired with a current driver is how an AppImage stops starting.
          rm -f AppDir/usr/lib/libvulkan.so.1*

          mkdir -p AppDir/usr/share/doc/sonora/icons
          cp COPYING AppDir/usr/share/doc/sonora/LICENSE
          cp THIRD-PARTY.md AppDir/usr/share/doc/sonora/
          cp assets/fonts/LICENSE.txt AppDir/usr/share/doc/sonora/LICENSE.Inter
          cp assets/icons/LICENSE AppDir/usr/share/doc/sonora/icons/LICENSE
          for licence in assets/icons/*/LICENSE; do
            pack="$(basename "$(dirname "$licence")")"
            cp "$licence" "AppDir/usr/share/doc/sonora/icons/LICENSE.$pack"
          done

      - name: build the AppImage
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          UPDATE: ${{ steps.meta.outputs.update }}
        run: |
          set -euo pipefail
          mkdir -p dist
          image="sonora-$VERSION-$ARCH.AppImage"

          # Given update information, appimagetool embeds it and writes the .zsync that
          # AppImageUpdate diffs against beside the image, with a zsyncmake of its own.
          # It also copies a VERSION it finds in its environment into X-AppImage-Version,
          # which would put the tag's v prefix over the bare number the desktop file carries.
          flags=()
          if [ -n "$UPDATE" ]; then flags=(--updateinformation "$UPDATE"); fi
          env -u VERSION ./appimagetool "${flags[@]}" AppDir "dist/$image"
          if [ -f "$image.zsync" ]; then mv "$image.zsync" dist/; fi

      - name: inspect the AppImage
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          NUMBER: ${{ steps.meta.outputs.number }}
          UPDATE: ${{ steps.meta.outputs.update }}
        run: |
          set -euo pipefail
          cd dist
          image="sonora-$VERSION-$ARCH.AppImage"
          "./$image" --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/sonora
          test -f squashfs-root/sonora.desktop
          grep -qx "X-AppImage-Arch=$ARCH" squashfs-root/sonora.desktop
          if [ -n "$NUMBER" ]; then
            grep -qx "X-AppImage-Version=$NUMBER" squashfs-root/sonora.desktop
          fi
          if [ -n "$UPDATE" ]; then
            test -f "$image.zsync"
            # The runtime answers nothing to this flag once it is told to extract and run.
            test "$(env -u APPIMAGE_EXTRACT_AND_RUN "./$image" --appimage-updateinformation)" = "$UPDATE"
          else
            test ! -e "$image.zsync"
          fi
          test -f squashfs-root/usr/share/doc/sonora/THIRD-PARTY.md
          test ! -e squashfs-root/usr/lib/libvulkan.so.1
          ldd squashfs-root/usr/bin/sonora
          rm -rf squashfs-root

      - uses: actions/upload-artifact@v4
        with:
          name: release-appimage-${{ matrix.variant.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: ${{ inputs.nightly && 7 || 0 }}

  # Build flatpak, see: https://github.com/flatpak/flatpak-github-actions
  flatpak:
    name: "Flatpak (${{ matrix.variant.arch }})"
    if: ${{ !inputs.nightly }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm

    runs-on: ${{ matrix.variant.runner }}

    container:
      # Use an image generated by Flathub to avoid re-installing the SDKs for every build,
      # see: https://github.com/flathub-infra/actions-images
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: name the artifact
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) version="$GITHUB_REF_NAME" ;;
            *) version="${GITHUB_SHA:0:7}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install flatpak-cargo-generator
        run: |
          python3 -m pip install --break-system-packages flatpak-cargo-generator

      - name: Generate Cargo Sources
        run: |
          chmod +x ./flatpak/generate-sources.sh
          ./flatpak/generate-sources.sh

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/flatpak-builder.yaml
          bundle: sonora-${{ steps.meta.outputs.version }}-${{ matrix.variant.arch }}.flatpak
          arch: ${{ matrix.variant.arch }}
          upload-artifact: true
          artifact-name: flatpak-${{ matrix.variant.arch }}

  flatpak-repo:
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # A fork without the signing key has no repo to publish to, so it attaches the bundles the
    # flatpak job built, unsigned and without a remote, and leaves the flatpak-repo branch alone.
    env:
      SIGNED: ${{ secrets.FLATPAK_GPG_KEY != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: flatpak-*
          path: bundles
          merge-multiple: true

      - name: attach the unsigned bundles
        if: env.SIGNED != 'true'
        run: |
          set -euo pipefail
          echo "::warning::FLATPAK_GPG_KEY is not set, so the release carries unsigned Flatpak bundles and no repo is published"
          mkdir -p dist
          cp bundles/*.flatpak dist/

      - name: system dependencies
        if: env.SIGNED == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree

      - name: import the signing key
        if: env.SIGNED == 'true'
        id: key
        env:
          KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        run: |
          set -euo pipefail
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          echo "$KEY" | gpg --batch --import
          fingerprint="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: fetch the published repo
        if: env.SIGNED == 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch flatpak-repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" site \
            || mkdir site
          rm -rf site/.git

      - name: publish the bundles
        if: env.SIGNED == 'true'
        env:
          FINGERPRINT: ${{ steps.key.outputs.fingerprint }}
        run: |
          set -euo pipefail
          # Git cannot preserve OSTree's empty remote refs directory on the
          # flatpak-repo branch, but static-delta generation expects it.
          mkdir -p site/repo/tmp site/repo/refs/remotes
          test -f site/repo/config || ostree init --repo=site/repo --mode=archive
          for bundle in bundles/*.flatpak; do
            flatpak build-import-bundle \
              --gpg-sign="$FINGERPRINT" \
              --gpg-homedir="$GNUPGHOME" \
              site/repo "$bundle"
          done
          flatpak build-update-repo \
            --title=Sonora \
            --generate-static-deltas \
            --prune \
            --prune-depth=3 \
            --gpg-sign="$FINGERPRINT" \
            --gpg-homedir="$GNUPGHOME" \
            site/repo
          rm -rf site/repo/tmp
          cp -R flatpak/pages/. site/

      - name: export the bundles
        if: env.SIGNED == 'true'
        env:
          VERSION: ${{ github.ref_name }}
        run: ./flatpak/export-bundles.sh site/repo "$VERSION" dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-flatpak
          path: dist/*
          if-no-files-found: error

      - name: push the repo
        if: env.SIGNED == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd site
          git init -q -b flatpak-repo
          git add -A
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(flatpak): publish $VERSION"
          git push --force "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY" flatpak-repo

  release:
    needs: [build, bundle, appimage, flatpak, flatpak-repo]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: stage the licenses
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p licenses
          cp COPYING licenses/LICENSE
          cp THIRD-PARTY.md licenses/THIRD-PARTY.md
          cp assets/fonts/LICENSE.txt licenses/LICENSE.Inter
          mkdir -p licenses/icons
          cp assets/icons/LICENSE licenses/icons/LICENSE
          for licence in assets/icons/*/LICENSE; do
            pack="$(basename "$(dirname "$licence")")"
            cp "$licence" "licenses/icons/LICENSE.$pack"
          done
          tar -czf "dist/sonora-$VERSION-licenses.tar.gz" -C licenses .

      - name: checksums
        run: cd dist && shasum -a 256 * > SHA256SUMS

      - name: release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > notes.md
          printf '\n[Code signing policy](https://github.com/%s#code-signing)\n' "$GITHUB_REPOSITORY" >> notes.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  announce:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/announce.yml
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}
