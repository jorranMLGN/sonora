<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{jam-page-title}}</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0e0e11;
        --fg: #f3f3f5;
        --dim: #9a9aa5;
        --line: #26262d;
        --fill: #1a1a20;
        --accent: #5b8cff;
        --live: #3ecf8e;
        --warn: #e8734a;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fbfbfd;
          --fg: #16161a;
          --dim: #6a6a75;
          --line: #e2e2e8;
          --fill: #f1f1f5;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
        padding: 24px 16px 40px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { width: 100%; max-width: 440px; }
      .eyebrow {
        color: var(--dim);
        font-size: 12px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }
      .art {
        width: 100%;
        aspect-ratio: 1;
        margin: 14px 0 18px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--fill) center/cover no-repeat;
      }
      h1 { margin: 0; font-size: 21px; font-weight: 650; line-height: 1.25; }
      .artist { margin-top: 2px; font-size: 15px; }
      .album, .meta { color: var(--dim); font-size: 13px; }
      .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .badge {
        padding: 3px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 12px;
        color: var(--dim);
      }
      .badge.live { border-color: var(--live); color: var(--live); }
      .badge.warn { border-color: var(--warn); color: var(--warn); }
      .track { margin-top: 14px; height: 4px; border-radius: 999px; background: var(--fill); }
      .track > div { height: 100%; width: 0; border-radius: 999px; background: var(--accent); }
      .times { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--dim); }
      button {
        width: 100%;
        margin-top: 20px;
        padding: 15px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled { opacity: 0.45; cursor: default; }
      .card { margin-top: 18px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; }
      label { display: block; font-size: 13px; color: var(--dim); }
      input[type="range"] { width: 100%; margin-top: 10px; accent-color: var(--accent); }
      .row { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--dim); }
      .hint { margin-top: 14px; font-size: 13px; color: var(--warn); }
      .find { display: flex; gap: 8px; margin-top: 10px; }
      .find input[type="search"] {
        flex: 1;
        min-width: 0;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
      }
      .find button { width: auto; margin: 0; padding: 11px 16px; }
      .hits { margin-top: 12px; display: flex; flex-direction: column; gap: 2px; }
      .hit { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
      .hit:first-child { border-top: 0; }
      .thumb { width: 40px; height: 40px; flex: none; border-radius: 6px; background: var(--fill) center/cover no-repeat; }
      .hit .who { flex: 1; min-width: 0; }
      .hit .who div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .hit .name { font-size: 14px; }
      .hit .by { font-size: 12px; color: var(--dim); }
      .hit button { width: 38px; margin: 0; padding: 8px 0; border-radius: 9px; flex: none; }
      .said { margin-top: 10px; font-size: 13px; color: var(--dim); }
      .fault { margin-top: 10px; font-size: 12px; color: var(--warn); word-break: break-word; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow" id="room">{{jam-page-title}}</div>
      <div class="art" id="art"></div>

      <h1 id="title">{{jam-page-nothing}}</h1>
      <div class="artist" id="artist"></div>
      <div class="album" id="album"></div>

      <div class="badges">
        <span class="badge" id="link">{{jam-page-waiting}}</span>
        <span class="badge" id="provider" hidden></span>
        <span class="badge" id="state" hidden></span>
      </div>

      <div class="track"><div id="progress"></div></div>
      <div class="times"><span id="at">0:00</span><span id="total">0:00</span></div>

      <button id="play" disabled>{{jam-page-play}}</button>
      <div class="hint" id="hint">{{jam-page-tap}}</div>

      <div class="card">
        <label for="query">{{jam-page-search}}</label>
        <form class="find" id="find">
          <input id="query" type="search" placeholder="{{jam-page-search-hint}}" autocomplete="off" />
          <button type="submit">{{jam-page-search-go}}</button>
        </form>
        <div class="hits" id="hits"></div>
        <div class="said" id="said"></div>
      </div>

      <div class="card">
        <label for="offset">{{jam-page-offset}}</label>
        <input id="offset" type="range" min="-500" max="500" step="5" value="0" />
        <div class="row"><span id="offsetValue">0 ms</span><span id="buffer">{{jam-page-buffer}}</span></div>
        <div class="row"><span id="sync"></span><span id="drift"></span></div>
        <div class="row"><span id="stream"></span><span id="ping"></span></div>
        <div class="fault" id="fault" hidden></div>
      </div>
    </main>

    <script>
      const TEXT = {
        play: "{{jam-page-play}}",
        stop: "{{jam-page-stop}}",
        waiting: "{{jam-page-waiting}}",
        connected: "{{jam-page-connected}}",
        lost: "{{jam-page-lost}}",
        nothing: "{{jam-page-nothing}}",
        buffer: "{{jam-page-buffer}}",
        sync: "{{jam-page-sync}}",
        drift: "{{jam-page-drift}}",
        behind: "{{jam-page-behind}}",
        playing: "{{jam-page-playing}}",
        paused: "{{jam-page-paused}}",
        tap: "{{jam-page-tap}}",
        silent: "{{jam-page-silent}}",
        local: "{{jam-page-local}}",
        chunks: "{{jam-page-chunks}}",
        added: "{{jam-page-added}}",
        nothing_found: "{{jam-page-no-hits}}",
        searching: "{{jam-page-searching}}",
        denied: {
          Closed: "{{jam-page-denied-closed}}",
          Unknown: "{{jam-page-denied-unknown}}",
          Busy: "{{jam-page-denied-busy}}",
        },
        refused: {
          Protocol: "{{jam-refused-protocol}}",
          Code: "{{jam-refused-code}}",
          Codec: "{{jam-refused-codec}}",
          Full: "{{jam-refused-full}}",
          Closed: "{{jam-refused-closed}}",
        },
      };
      const LABELS = {
        spotify: "Spotify",
        soundcloud: "SoundCloud",
        youtube: "YouTube Music",
        local: TEXT.local,
      };
      const MAGIC = 0x314a4e53;
      const HEADER = 16;
      const TRIM_KEY = "sonora.jam.offset";
      const SAMPLES = 8;
      const BURST = 8;
      const BURST_GAP = 150;
      const PROBE_GAP = 2000;
      const TICK = 200;
      const HELD = 2;
      const RESET = 100;
      const PPM_PER_MS = 500;
      const MAX_PPM = 3000;
      const EASE = 0.15;
      const GUARD = 0.005;
      const MARGIN = 40;

      const el = (id) => document.getElementById(id);
      const code = location.pathname.split("/").filter(Boolean).pop();
      const clock = (ms) => {
        const total = Math.max(0, Math.round(ms / 1000));
        return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
      };

      const now = () => performance.timeOrigin + performance.now();
      const taken = [];

      let socket = null;
      let ctx = null;
      let gain = null;
      let format = null;
      let lead = 250;
      let origin = 0;
      let base = null;
      let playAt = null;
      let running = false;

      let duration = 0;
      let position = 0;
      let positionAt = 0;
      let hostPlaying = false;
      let chunks = 0;
      let heard = 0;
      let trim = 0;
      let offset = 0;
      let rtt = 0;
      let drift = 0;
      let behind = false;
      let probe = 0;
      let refused = false;

      try {
        trim = Number(localStorage.getItem(TRIM_KEY)) || 0;
      } catch (_) {}
      el("offset").value = String(trim);
      el("offsetValue").textContent = `${trim} ms`;

      window.addEventListener("error", (event) => fault(event.message));

      function fault(message) {
        const line = el("fault");
        line.hidden = false;
        line.textContent = message;
      }

      el("offset").addEventListener("input", (event) => {
        trim = Number(event.target.value) || 0;
        el("offsetValue").textContent = `${trim} ms`;
        try {
          localStorage.setItem(TRIM_KEY, String(trim));
        } catch (_) {}
      });

      el("find").addEventListener("submit", (event) => {
        event.preventDefault();
        const query = el("query").value.trim();
        if (!query || !socket || socket.readyState !== 1) return;
        el("said").textContent = TEXT.searching;
        el("hits").textContent = "";
        socket.send(JSON.stringify({ kind: "Find", query }));
      });

      el("play").addEventListener("click", async () => {
        try {
          if (running) return stop();
          await start();
        } catch (error) {
          fault(String(error));
        }
      });

      function sample(t0, t1, t2, t3) {
        taken.push({ offset: (t1 - t0 + (t2 - t3)) / 2, rtt: t3 - t0 - (t2 - t1) });
        while (taken.length > SAMPLES) taken.shift();
        const best = taken.reduce((a, b) => (b.rtt < a.rtt ? b : a));
        offset = best.offset;
        rtt = best.rtt;
      }

      function bind(seed) {
        if (!ctx) return;
        const stamp = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
        const heard_at = stamp && stamp.contextTime > 0 && stamp.performanceTime > 0;
        const at = heard_at ? stamp.contextTime : ctx.currentTime - latency();
        const local = heard_at ? performance.timeOrigin + stamp.performanceTime : now();
        const seen = local - at * 1000;
        base = seed || base === null ? seen : base + (seen - base) * EASE;
      }

      function latency() {
        return ctx.outputLatency || ctx.baseLatency || 0;
      }

      function need() {
        if (!ctx) return 0;
        const stamp = ctx.getOutputTimestamp ? ctx.getOutputTimestamp() : null;
        const out =
          stamp && stamp.contextTime > 0
            ? (ctx.currentTime - stamp.contextTime) * 1000
            : latency() * 1000;
        return Math.max(0, Math.round(out + rtt / 2 + MARGIN));
      }

      function ping(token, sent) {
        if (token !== probe || !socket || socket.readyState !== 1) return;
        socket.send(JSON.stringify({ kind: "Ping", t0: Math.round(now()), need: need() }));
        setTimeout(() => ping(token, sent + 1), sent + 1 < BURST ? BURST_GAP : PROBE_GAP);
      }

      async function start() {
        if (!format) return;
        ctx = new AudioContext({ sampleRate: format.rate, latencyHint: "interactive" });
        gain = ctx.createGain();
        gain.connect(ctx.destination);
        await ctx.resume();
        playAt = null;
        base = null;
        behind = false;
        bind(true);
        running = true;
        el("play").textContent = TEXT.stop;
        el("hint").hidden = true;
      }

      function stop() {
        running = false;
        playAt = null;
        base = null;
        behind = false;
        el("play").textContent = TEXT.play;
        el("hint").hidden = false;
        el("hint").textContent = TEXT.tap;
        if (ctx) {
          ctx.close().catch(() => {});
          ctx = null;
        }
      }

      function connect() {
        taken.length = 0;
        playAt = null;
        socket = new WebSocket(`ws://${location.host}${location.pathname}/ws`);
        socket.binaryType = "arraybuffer";

        socket.addEventListener("open", () => {
          socket.send(
            JSON.stringify({
              kind: "Hello",
              protocol: {{protocol}},
              name: navigator.userAgent.slice(0, 40),
              native: false,
              code,
              accepts: ["pcm16"],
            }),
          );
          probe += 1;
          ping(probe, 0);
        });

        socket.addEventListener("message", (event) => {
          try {
            if (typeof event.data === "string") return text(JSON.parse(event.data));
            audio(new DataView(event.data));
          } catch (error) {
            fault(String(error));
          }
        });

        socket.addEventListener("close", () => {
          stop();
          el("play").disabled = true;
          if (refused) return;

          el("link").textContent = TEXT.lost;
          el("link").className = "badge warn";
          setTimeout(connect, 2000);
        });
      }

      function text(message) {
        switch (message.kind) {
          case "Welcome":
            format = message.format;
            lead = message.lead_ms;
            origin = message.origin;
            el("room").textContent = message.room;
            el("link").textContent = TEXT.connected;
            el("link").className = "badge live";
            el("play").disabled = false;
            el("stream").textContent =
              `${format.rate} Hz · ${format.channels} ch · ${format.codec}`;
            break;
          case "Now":
            el("title").textContent = message.title || TEXT.nothing;
            el("artist").textContent = message.artist || "";
            el("album").textContent = message.album || "";
            el("art").style.backgroundImage = message.cover ? `url("${message.cover}")` : "";
            duration = message.duration_ms || 0;
            el("total").textContent = clock(duration);
            show("provider", LABELS[message.provider] || message.provider);
            break;
          case "Transport":
            hostPlaying = message.playing;
            position = message.position_ms || 0;
            positionAt = performance.now();
            show("state", hostPlaying ? TEXT.playing : TEXT.paused);
            break;
          case "Found":
            hits(message.hits || []);
            break;
          case "Added":
            el("said").textContent = `${TEXT.added} ${message.title}`;
            break;
          case "Denied":
            el("said").textContent = TEXT.denied[message.reason] || String(message.reason);
            break;
          case "Mark":
            origin = message.origin;
            playAt = null;
            break;
          case "Lead":
            lead = message.lead_ms;
            break;
          case "Pong":
            sample(message.t0, message.t1, message.t2, now());
            break;
          case "Refused":
            refused = !["Closed", "Full"].includes(message.reason);
            if (!refused) setTimeout(connect, 4000);
            el("link").textContent = TEXT.refused[message.reason] || String(message.reason);
            el("link").className = "badge warn";
            socket.close();
            break;
          case "Ended":
            el("link").textContent = TEXT.lost;
            el("link").className = "badge warn";
            socket.close();
            break;
        }
      }

      function hits(found) {
        const list = el("hits");
        list.textContent = "";
        el("said").textContent = found.length ? "" : TEXT.nothing_found;

        for (const found_track of found) {
          const row = document.createElement("div");
          row.className = "hit";

          const thumb = document.createElement("div");
          thumb.className = "thumb";
          if (found_track.cover) thumb.style.backgroundImage = `url("${found_track.cover}")`;

          const who = document.createElement("div");
          who.className = "who";
          const name = document.createElement("div");
          name.className = "name";
          name.textContent = found_track.title;
          const by = document.createElement("div");
          by.className = "by";
          by.textContent = [found_track.artist, LABELS[found_track.provider] || found_track.provider]
            .filter(Boolean)
            .join(" · ");
          who.append(name, by);

          const add = document.createElement("button");
          add.type = "button";
          add.textContent = "+";
          add.addEventListener("click", () => {
            if (!socket || socket.readyState !== 1) return;
            socket.send(JSON.stringify({ kind: "Add", id: found_track.id }));
            add.disabled = true;
          });

          row.append(thumb, who, add);
          list.append(row);
        }
      }

      function show(id, value) {
        const node = el(id);
        node.hidden = !value;
        node.textContent = value || "";
      }

      function audio(view) {
        chunks += 1;
        if (view.byteLength <= HEADER || view.getUint32(0, true) !== MAGIC) return;
        if (!running || !ctx || !format || base === null) return;

        const first = Number(view.getBigUint64(8, true));
        const channels = format.channels;
        const samples = new Int16Array(view.buffer, HEADER);
        const frames = Math.floor(samples.length / channels);
        if (frames === 0) return;

        const buffer = ctx.createBuffer(channels, frames, format.rate);
        for (let channel = 0; channel < channels; channel += 1) {
          const lane = buffer.getChannelData(channel);
          for (let frame = 0; frame < frames; frame += 1) {
            lane[frame] = samples[frame * channels + channel] / 32768;
          }
        }

        const due = origin + (first * 1000) / format.rate + lead;
        const target = (due - offset + trim - base) / 1000;
        if (playAt === null) playAt = target;

        const error = (playAt - target) * 1000;
        let rate = 1;
        if (Math.abs(error) >= RESET) {
          playAt = target;
        } else if (Math.abs(error) > HELD) {
          rate = 1 + clamp(error * PPM_PER_MS, MAX_PPM) / 1e6;
        }

        const startAt = Math.max(playAt, ctx.currentTime + GUARD);
        behind = startAt > playAt;
        playAt = startAt;
        drift = Math.round((playAt - target) * 1000);

        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.playbackRate.value = rate;
        source.connect(gain);
        source.start(playAt);
        playAt += frames / format.rate / rate;
        heard += frames;
      }

      function clamp(value, reach) {
        return Math.max(-reach, Math.min(reach, value));
      }

      setInterval(() => {
        bind(false);

        if (hostPlaying) {
          const moved = position + (performance.now() - positionAt);
          el("at").textContent = clock(moved);
          el("progress").style.width =
            duration > 0 ? `${Math.min(100, (moved / duration) * 100)}%` : "0";
        }

        const scheduled = ctx && running && playAt !== null;
        const ahead = scheduled ? Math.round((playAt - ctx.currentTime) * 1000) : 0;
        el("buffer").textContent = `${TEXT.buffer} ${ahead} ms`;
        el("offsetValue").textContent = `${trim} ms`;
        el("sync").textContent = taken.length ? `${TEXT.sync} ${Math.round(offset)} ms` : "";
        el("drift").textContent = scheduled ? `${TEXT.drift} ${drift} ms` : "";
        el("ping").textContent = taken.length ? `${Math.round(rtt)} ms` : "";
        el("stream").textContent = format
          ? `${format.rate} Hz · ${format.channels} ch · ${TEXT.chunks} ${chunks}`
          : "";

        if (running && behind) {
          el("hint").hidden = false;
          el("hint").textContent = TEXT.behind;
        } else if (running && chunks > 0 && heard === 0) {
          el("hint").hidden = false;
          el("hint").textContent = TEXT.silent;
        }
      }, TICK);

      connect();
    </script>
  </body>
</html>
