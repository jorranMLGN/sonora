[package]
name = "mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "lib"]

[features]
# The providers the phone signs in to besides SoundCloud, which is always there.
default = ["spotify", "youtube"]
spotify = ["music/spotify"]
youtube = ["music/youtube"]

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
fastrand.workspace = true
futures.workspace = true
log.workspace = true
music = { path = "../music", default-features = false }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uniffi.workspace = true

# iOS has no libsqlite3 to link against, so SQLite is compiled in there, as on Windows.
[target.'cfg(target_os = "ios")'.dependencies]
music = { path = "../music", default-features = false, features = ["bundled-sqlite"] }
# QuickJS, which YouTube runs its player script in, ships no prebuilt bindings for iOS, so they
# are generated at build time.
rquickjs = { workspace = true, features = ["bindgen"] }
